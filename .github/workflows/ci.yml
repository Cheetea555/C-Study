name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check (all apps)
        run: |
          set -e
          for d in kaoyan-math2 kaoyan-408 kaoyan-en2 kaoyan-politics; do
            echo "▶ node --check $d"
            for file in "$d"/*.js; do node --check "$file"; done
          done

      - name: Run all tests (4 apps × 5 suites)
        run: |
          set -e
          for d in kaoyan-math2 kaoyan-408 kaoyan-en2 kaoyan-politics; do
            for t in test.js test-data.js test-lessons.js test-formulas.js test-mistake.js; do
              echo "▶ $d/$t"
              (cd "$d" && node "$t")
            done
          done

      - name: Shared workspace regression tests
        run: |
          set -e
          for file in assets/*.js tests/*.js scripts/*.js; do node --check "$file"; done
          node tests/workspace.test.js
          node tests/storage.test.js
          node tests/content.test.js
          node tests/search.test.js
          node tests/review.test.js
          node tests/planner.test.js
          node tests/coverage.test.js
          node tests/backup.test.js
          node tests/replacement.test.js
          node scripts/build-search-index.js --check
          node scripts/build-plan-catalog.js --check
          node scripts/build-content-coverage.js --check
